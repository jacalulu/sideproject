name: iOS TestFlight

# Manual trigger: run from the Actions tab once the Apple secrets are set.
# Requires repo secrets:
#   APP_STORE_CONNECT_KEY_ID      - App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   - App Store Connect issuer ID
#   APP_STORE_CONNECT_KEY_B64     - the .p8 key file, base64-encoded
#   APPLE_TEAM_ID                 - 10-char Apple Developer team ID
#   IOS_DIST_CERT_P12             - Apple Distribution cert + private key,
#                                   as a .p12, base64-encoded
#   IOS_DIST_CERT_PASSWORD        - password protecting that .p12
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync web app into the iOS project
        run: |
          npm ci || npm install
          npx cap sync ios

      - name: Write App Store Connect API key to disk for xcodebuild
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY_B64" | base64 -d > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8" >> "$GITHUB_ENV"
        env:
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      # The distribution certificate is supplied, not created: a runner cannot
      # persist a private key, so letting Xcode manage signing minted and
      # abandoned a new certificate every run.
      - name: Write and validate the distribution certificate
        run: |
          set -euo pipefail
          if [ -z "${IOS_DIST_CERT_P12:-}" ]; then
            echo "::error::Secret IOS_DIST_CERT_P12 is empty or unset."
            exit 1
          fi
          if [ -z "${IOS_DIST_CERT_PASSWORD:-}" ]; then
            echo "::error::Secret IOS_DIST_CERT_PASSWORD is empty or unset."
            exit 1
          fi
          echo "$IOS_DIST_CERT_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          if [ ! -s "$RUNNER_TEMP/dist.p12" ]; then
            echo "::error::Decoded .p12 is empty — IOS_DIST_CERT_P12 is not valid base64."
            exit 1
          fi
          # Fail here, with a readable reason, rather than 60s later inside gym.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -noout \
                 -passin pass:"$IOS_DIST_CERT_PASSWORD" 2>/tmp/p12err; then
            echo "::error::Could not open the .p12 — wrong IOS_DIST_CERT_PASSWORD, or the file is not a valid PKCS#12 bundle."
            sed 's/^/  /' /tmp/p12err
            exit 1
          fi
          # Confirm it is a distribution certificate carrying its private key:
          # a certificate without the key is exactly the failure mode that made
          # cloud-managed signing unusable here.
          openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -clcerts -nokeys \
            -passin pass:"$IOS_DIST_CERT_PASSWORD" 2>/dev/null \
            | openssl x509 -noout -subject -enddate
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nocerts -noout \
                 -passin pass:"$IOS_DIST_CERT_PASSWORD" 2>/dev/null; then
            echo "::error::The .p12 contains no private key. Re-export including the key."
            exit 1
          fi
          echo "IOS_DIST_CERT_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"

          # The .p12 holds the leaf certificate and its private key, but not
          # the intermediate that issued it. Without that intermediate the
          # chain does not resolve and macOS does not count the certificate as
          # a valid codesigning identity — which is how run #9 reached sigh
          # with "0 valid identities found".
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          if [ ! -s "$RUNNER_TEMP/AppleWWDRCAG3.cer" ]; then
            echo "::error::Failed to download the Apple WWDR intermediate certificate."
            exit 1
          fi
          echo "WWDR_CERT_PATH=$RUNNER_TEMP/AppleWWDRCAG3.cer" >> "$GITHUB_ENV"
          openssl x509 -in "$RUNNER_TEMP/AppleWWDRCAG3.cer" -inform DER -noout -subject -enddate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Build and upload to TestFlight
        # --verbose prints the exportArchive invocation and its raw output.
        # Without it gym reports only its own inferred cause and the real
        # error never reaches the log. Temporary, for diagnosing signing.
        run: fastlane ios beta --verbose
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # exportArchive writes its real error to a log on the runner that gym
      # never prints, leaving only fastlane's guess ("no provisioning profile
      # mapping was provided") in the console. Surface it so signing failures
      # can be diagnosed from the run instead of inferred.
      - name: Dump Xcode signing and export logs on failure
        if: failure()
        run: |
          echo "===== gym log directory ====="
          ls -la ~/Library/Logs/gym/ 2>/dev/null || echo "(no gym log directory)"
          for f in ~/Library/Logs/gym/*.log; do
            [ -e "$f" ] || continue
            echo ""
            echo "===== $f ====="
            echo "--- signing / provisioning / error lines ---"
            grep -niE "error|provisioning|certificate|signing|codesign|entitlement" "$f" | tail -n 150 || true
            echo "--- last 60 lines ---"
            tail -n 60 "$f"
          done
          echo ""
          echo "===== available signing identities ====="
          security find-identity -v -p codesigning || true
          echo "===== installed provisioning profiles ====="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none installed)"

