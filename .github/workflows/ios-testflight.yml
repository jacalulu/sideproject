name: iOS TestFlight

# Manual trigger: run from the Actions tab once the four Apple secrets are set.
# Requires repo secrets:
#   APP_STORE_CONNECT_KEY_ID      - App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   - App Store Connect issuer ID
#   APP_STORE_CONNECT_KEY_B64     - the .p8 key file, base64-encoded
#   APPLE_TEAM_ID                 - 10-char Apple Developer team ID
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor and sync web app into the iOS project
        run: |
          npm ci || npm install
          npx cap sync ios

      - name: Write App Store Connect API key to disk for xcodebuild
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY_B64" | base64 -d > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8" >> "$GITHUB_ENV"
        env:
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      - name: Build and upload to TestFlight
        # --verbose prints the exportArchive invocation and its raw output.
        # Without it gym reports only its own inferred cause and the real
        # error never reaches the log. Temporary, for diagnosing signing.
        run: fastlane ios beta --verbose
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # exportArchive writes its real error to a log on the runner that gym
      # never prints, leaving only fastlane's guess ("no provisioning profile
      # mapping was provided") in the console. Surface it so signing failures
      # can be diagnosed from the run instead of inferred.
      - name: Dump Xcode signing and export logs on failure
        if: failure()
        run: |
          echo "===== gym log directory ====="
          ls -la ~/Library/Logs/gym/ 2>/dev/null || echo "(no gym log directory)"
          for f in ~/Library/Logs/gym/*.log; do
            [ -e "$f" ] || continue
            echo ""
            echo "===== $f ====="
            echo "--- signing / provisioning / error lines ---"
            grep -niE "error|provisioning|certificate|signing|codesign|entitlement" "$f" | tail -n 150 || true
            echo "--- last 60 lines ---"
            tail -n 60 "$f"
          done
          echo ""
          echo "===== available signing identities ====="
          security find-identity -v -p codesigning || true
          echo "===== installed provisioning profiles ====="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none installed)"

